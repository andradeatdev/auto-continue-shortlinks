name: Suggest a feature
description: Propose a new capability or an improvement to the script
title: "[feature] "
labels: ["feature-request", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check the existing issues first and add a 👍 or a comment instead of opening a duplicate.
        To request support for a **new site**, use the [Site requests](https://github.com/andradeatdev/auto-continue-shortlinks/discussions/10) thread in Discussions instead.

  - type: textarea
    id: idea
    attributes:
      label: What should the script do?
      description: Describe the feature in a few sentences.
      placeholder: Skip the countdown when the timer runs on the client side.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What problem does it solve, or what do you do manually today? (optional)

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the script does it touch? Pick "Not sure" if you don't know.
      options:
        - Not sure
        - Cache
        - Continue
        - Patcher
        - Menu commands
        - Other

  - type: input
    id: url
    attributes:
      label: Example URL (if it applies)
      placeholder: https://tpi.li/abc123