name: Site stopped working
description: A supported site no longer continues automatically
title: "[site-broken] "
labels: ["site-broken", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the existing issues for the same site first and add a 👍 or a comment instead of opening a duplicate.

  - type: input
    id: url
    attributes:
      label: Page URL(s)
      description: One link is enough, but a couple more from the same site help me tell whether it's a general problem or just that link. One per line.
      placeholder: |
        https://tpi.li/abc123
        https://tpi.li/def456
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: What happens?
      options:
        - Stuck on a button or captcha
        - Asks to disable adblock
        - Redirects to the wrong page
        - Final download does not start
        - Script does nothing
        - Other
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Anything that helps reproduce it (optional).

  - type: input
    id: version
    attributes:
      label: Script version
      description: Shown in the last option of the script's menu (Menu → this script).
      placeholder: x.y.z 
    validations:
      required: true

  - type: checkboxes
    id: toggles
    attributes:
      label: Menu toggles I turned off for this domain
      description: Violentmonkey/Tampermonkey menu → this script. Leave empty if you changed nothing.
      options:
        - label: cache
        - label: patcher
        - label: continue

  - type: input
    id: env
    attributes:
      label: Browser and userscript manager
      placeholder: Firefox 158 + Violentmonkey 2.49

  - type: textarea
    id: other-extensions
    attributes:
      label: Other extensions active on the page
      description: uBlock Origin, AdGuard, Privacy Badger, etc. Many "disable adblock" warnings come from these.